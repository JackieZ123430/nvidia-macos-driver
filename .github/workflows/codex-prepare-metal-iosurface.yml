name: Prepare Metal IOSurface PR branch
on:
  push:
    branches: [codex/prepare-metal-iosurface-pr]
    paths: [.github/workflows/codex-prepare-metal-iosurface.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'JackieZ123430/nvidia-macos-driver'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 305f21aa05dfdc40472994d4efed0e4731624718
      - name: Apply source edits and verify exact candidate hashes
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess
          edits = r'''[["plugin/NVMTLEmbedded.m","510080ad5e7cd2282b0680b9941e1f0f64149fb2cc3c8a402e3d62640d25340d","c4438d1bcd2fec4beced8e97034b4ce9f8325d688421953697ad9b678c0b338e",[[294,295,"            nvmtl_surface_in_for_cb(cb, t);\n"]]],["plugin/NVMTLEventSync.m","cfb21b90b7a10651b73d2e7c5751cead2bf9b60bcf63b15fd788bb067faa3e81","0045cf7b119d334cf427ebba8fd1ccfa5484e46841cd37e1b0eaf4dd14d9cb5d",[[192,192,"    // Applications may retain completed command buffers. Pending overwrite\n    // bookkeeping must not keep their IOSurfaces and VRAM alive indefinitely.\n    [_surfOverwrites removeAllObjects]; _surfOverwrites = nil;\n"]]],["plugin/NVMTLObjects.h","283a35d5f7ee621224ee954fba5a6ac2cbd9eb0240f622eb23377828ad160c96","bf70877596d79b28a2ef2f5e41d82061baf17c6519a65c203b81e06e43f618ce",[[116,116,"  NSMutableSet *_surfOverwrites; // contents defined by writes recorded in this command buffer\n"]]],["plugin/NVMTLObjects.m","64ecadde0335174d5a5e6a9e5647d73abebed83e8779dd11fda098dd7fd3401c","786578550849494e400869ecef0571531714c8455be6e3ee54121e2c672ba66e",[[905,905,"// A full overwrite of a single 8-bit RGBA/BGRA subresource cannot consume the previous CPU contents.\n// Keep all partial updates, views, arrays, volumes, compressed and multisample images\n// on SurfaceIn: their untouched bytes still have to be preserved.\nstatic BOOL nvmtl_surface_full_overwrite(NVMTLTexture *t, MTLRegion r, NSUInteger level, NSUInteger slice) {\n    if (!t || !t->_surf || t->_parent || t->_viewParent || t->_tbView || t->_baseLevel || t->_baseSlice || level || slice)\n        return NO;\n    const nvk_image *i = &t->_i;\n    if (i->bpp != 4 || (t->_fmt != MTLPixelFormatBGRA8Unorm && t->_fmt != MTLPixelFormatBGRA8Unorm_sRGB\n        && t->_fmt != MTLPixelFormatRGBA8Unorm && t->_fmt != MTLPixelFormatRGBA8Unorm_sRGB)) return NO;\n    return i->mtl_type == MTLTextureType2D && i->mips == 1 && i->layers == 1 && i->samples <= 1\n        && i->bw <= 1 && i->bh <= 1 && !r.origin.x && !r.origin.y && !r.origin.z\n        && r.size.width == i->w && r.size.height == i->h && r.size.depth == 1;\n}\n// A recorded overwrite only defines contents for subsequent commands in this\n// command buffer. Do not promote global Seed/generation state before it executes:\n// an abandoned command buffer must leave SurfaceIn able to restore CPU contents.\nstatic void nvmtl_surface_overwrite_recorded(NVMTLCommandBuffer *cb, NVMTLTexture *t) {\n    if (!cb || !t) return;\n    NVMTLTexture *r = t->_parent ? t->_parent : t;\n    if (!r->_surf) return;\n    if (!cb->_surfOverwrites) cb->_surfOverwrites = [NSMutableSet new];\n    [cb->_surfOverwrites addObject:r];\n}\nstatic void nvmtl_surface_in_for_cb(NVMTLCommandBuffer *cb, NVMTLTexture *t) {\n    if (!t) return;\n    NVMTLTexture *r = t->_parent ? t->_parent : t;\n    if (cb && r->_surf && [cb->_surfOverwrites containsObject:r]) return;\n    [t nvmtlSurfaceIn];\n}\n"],[1186,1187,"    if (!bytes || row < (size_t)_i.w * (_i.bpp ? _i.bpp : 4) || !nvmtl_surface_full_overwrite(self, region, level, 0)) [self nvmtlSurfaceIn];\n"],[1201,1202,"    if (!bytes || row < (size_t)_i.w * (_i.bpp ? _i.bpp : 4) || !nvmtl_surface_full_overwrite(self, region, level, slice)) [self nvmtlSurfaceIn];\n"],[2489,2491,"                if (ca.loadAction == MTLLoadActionClear) nvmtl_surface_overwrite_recorded(cb, sr);\n                else nvmtl_surface_in_for_cb(cb, sr);\n"],[2699,2700,"    nvmtl_surface_in_for_cb(_cb, nt);\n"],[2733,2734,"    nvmtl_surface_in_for_cb(_cb, nt);\n"],[4065,4066,"    nvmtl_surface_in_for_cb(_cb, nt); if (nt->_stex) nvmtl_surf_dirty(_cb, nt);\n"],[4249,4250,"    nvmtl_surface_in_for_cb(_cb, s);\n    const BOOL overwrite = [s nvi] != [d nvi] && (!s->_surf || !d->_surf || IOSurfaceGetID(s->_surf) != IOSurfaceGetID(d->_surf))\n        && nvmtl_surface_full_overwrite(d, (MTLRegion){dof, size}, dl, ds);\n    if (!overwrite) nvmtl_surface_in_for_cb(_cb, d);\n    nvmtl_surf_dirty(_cb, d);\n"],[4254,4254,"    else if (overwrite) nvmtl_surface_overwrite_recorded(_cb, d);\n"],[4277,4278,"    nvmtl_surface_in_for_cb(_cb, t); nvmtl_surf_dirty(_cb, t);\n"],[4337,4338,"    const BOOL overwrite = nvmtl_surface_full_overwrite(t, (MTLRegion){dof, size}, dl, ds);\n    if (!overwrite) nvmtl_surface_in_for_cb(_cb, t);\n    nvmtl_surf_dirty(_cb, t);\n"],[4342,4343,"      if (rc) nvlog(\"blit copyFromBuffer:toTexture: FAILED (level %lu slice %lu)\", (unsigned long)dl, (unsigned long)ds);\n      else if (overwrite) nvmtl_surface_overwrite_recorded(_cb, t); }\n"],[4368,4369,"    nvmtl_surface_in_for_cb(_cb, t);\n"],[4486,4488,"            if (d.colorAttachments[0].loadAction == MTLLoadActionClear) nvmtl_surface_overwrite_recorded(self, sr);\n            else nvmtl_surface_in_for_cb(self, sr);\n"]]],["plugin/nvmtl_vk.c","b0fabfbb2487c1a73d730f601e6d8f9b34192c5e68ad2fdc3ff36476834f68bf","e7cd0e79d690de255a7caaca2f6361cebe231c33ad8569a3b721398e13227d54",[[5441,5441,"    // SurfaceOut also reads images last used as sampled/storage images or blit\n    // destinations. A completed fence does not change their image layout or\n    // provide the transfer-read dependency. Transition the copied subresource.\n    VkImageSubresourceRange range = { nvmtl_barrier_aspect(img), 0, 1, 0, 1 };\n    VkImageMemoryBarrier toSrc = { VK_STRUCTURE_TYPE_IMAGE_MEMORY_BARRIER, NULL,\n        VK_ACCESS_MEMORY_WRITE_BIT | VK_ACCESS_MEMORY_READ_BIT, VK_ACCESS_TRANSFER_READ_BIT,\n        (VkImageLayout)img->layout, VK_IMAGE_LAYOUT_TRANSFER_SRC_OPTIMAL,\n        VK_QUEUE_FAMILY_IGNORED, VK_QUEUE_FAMILY_IGNORED, (VkImage)img->img, range };\n    pvkCmdPipelineBarrier(c.cb, VK_PIPELINE_STAGE_ALL_COMMANDS_BIT, VK_PIPELINE_STAGE_TRANSFER_BIT,\n                         0, 0, NULL, 0, NULL, 1, &toSrc);\n    img->layout = VK_IMAGE_LAYOUT_TRANSFER_SRC_OPTIMAL;\n"]]]]'''
          records = json.loads(edits)
          assert len(records) == 5
          for name, before, after, changes in records:
              path = pathlib.Path(name)
              data = path.read_bytes()
              assert hashlib.sha256(data).hexdigest() == before, name
              lines = data.decode().splitlines(True)
              for start, end, replacement in reversed(changes):
                  lines[start:end] = [replacement]
              result = ''.join(lines).encode()
              assert hashlib.sha256(result).hexdigest() == after, name
              path.write_bytes(result)
              print(name, after)
          subprocess.run(['git', 'diff', '--check'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert sorted(changed) == sorted(r[0] for r in records)
      - name: Publish the five-file source branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -b fix/metal-iosurface-overwrite-sync
          git config user.name 'JackieZ123430'
          git config user.email '194886093+JackieZ123430@users.noreply.github.com'
          git add plugin/NVMTLEmbedded.m plugin/NVMTLEventSync.m plugin/NVMTLObjects.h plugin/NVMTLObjects.m plugin/nvmtl_vk.c
          git commit -m 'Fix Metal IOSurface overwrite synchronization and readback layout'
          git push origin HEAD:refs/heads/fix/metal-iosurface-overwrite-sync
